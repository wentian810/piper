dataset:
  repo_id: your_hf_user/task2_new
  root: /home/bbncf305/lerobot513/DP/lerobot_piper3/task2_new
  episodes: null
  revision: v3.0
  use_imagenet_stats: true
  video_backend: pyav
  streaming: false
  image_transforms:
    enable: true
    max_num_transforms: 1
    random_order: false
    tfs:
      resize:
        weight: 1.0
        type: Resize
        kwargs:
          size: [480, 640]

env: null

policy:
  type: diffusion
  push_to_hub: false
  repo_id: null
  device: cuda
  use_amp: false
  n_obs_steps: 2
  horizon: 64
  n_action_steps: 32

  normalization_mapping:
    VISUAL: MEAN_STD
    STATE: MIN_MAX
    ACTION: MIN_MAX

  drop_n_last_frames: 7

  vision_backbone: resnet18
  crop_shape: [440, 560]
  crop_is_random: false
  pretrained_backbone_weights: null
  use_group_norm: true
  spatial_softmax_num_keypoints: 32
  use_separate_rgb_encoder_per_camera: true

  down_dims: [512, 1024, 2048]
  kernel_size: 5
  n_groups: 8
  diffusion_step_embed_dim: 128
  use_film_scale_modulation: true

  noise_scheduler_type: DDPM
  num_train_timesteps: 100
  beta_schedule: squaredcos_cap_v2
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  clip_sample_range: 1.0

  num_inference_steps: null
  do_mask_loss_for_padding: false
  predict_action_as_delta_state: false
  delta_state_key: observation.state
  use_relative_state_conditioning: true
  relative_state_reduce: last_delta



output_dir: outputs/train/task2_new_diffusion
job_name: dp_task2_new
resume: false
seed: 100000
num_workers: 8
batch_size: 8
steps: 300000
eval_freq: -1
log_freq: 100
tolerance_s: 0.0001
save_checkpoint: true
save_freq: 20000
use_policy_training_preset: true
optimizer: null
scheduler: null

eval:
  n_episodes: 50
  batch_size: 50
  use_async_envs: false

wandb:
  enable: false
  disable_artifact: false
  project: lerobot_piper3
  entity: null
  notes: null
  run_id: null
  mode: null

peft: null
rename_map: {}
use_rabc: false
rabc_progress_path: null
rabc_kappa: 0.01
rabc_epsilon: 0.000001
rabc_head_mode: sparse
